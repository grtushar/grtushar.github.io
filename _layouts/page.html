---
layout: base
---
{% include site/topbar.html %}
<main id="content" class="page-main">
  <div class="page-wrap">
    {%- unless page.hide_header %}
    <header class="page-header">
      <h1 class="page-title">{{ page.title }}</h1>
      {%- if page.lead %}
      <p class="page-lead">{{ page.lead }}</p>
      {%- endif %}
    </header>
    {%- endunless %}
    {{ content }}
  </div>
</main>
{% include site/footer.html %}
